name: Restore release tag

# One-off maintenance job. Version tags (v*) are protected against creation, so
# they can only be made by the release process. A history rewrite orphaned the
# 3.x tags, which left semantic-release computing versions that already exist on
# npm. This recreates a single tag at a commit that is on master, using the same
# token the release job uses, so the version lineage points at real history
# again. Delete this workflow once the tag is back.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, for example v3.3.0'
        required: true
      sha:
        description: 'Commit the tag points at, must be on master'
        required: true

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Refuse anything that is not on master
        run: |
          git merge-base --is-ancestor "${{ inputs.sha }}" origin/master \
            || { echo "::error::${{ inputs.sha }} is not an ancestor of master"; exit 1; }

      - name: Create and push the tag
        run: |
          git tag "${{ inputs.tag }}" "${{ inputs.sha }}"
          git push origin "refs/tags/${{ inputs.tag }}"
          echo "created ${{ inputs.tag }} at ${{ inputs.sha }}"
